# Formación del clúster: ambos nodos conocen la lista de pares (classic_config)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Memoria acotada: dos nodos conviven en una EC2 pequeña
vm_memory_high_watermark.relative = 0.3
disk_free_limit.absolute = 500MB
