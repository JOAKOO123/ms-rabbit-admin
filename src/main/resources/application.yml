spring:
  application:
    name: ms-rabbit-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8090}

hotel:
  messaging:
    dlx: hotel.dlx
    exchanges:
      eventos: hotel.eventos
      documentos: hotel.documentos
    queues:
      notificaciones: q.notificaciones
      tickets: q.tickets
      documentos: q.documentos
    routing:
      notificaciones:
        - usuario.registrado
        - reserva.#
      tickets:
        - reserva.creada
      documentos:
        - comprobante
